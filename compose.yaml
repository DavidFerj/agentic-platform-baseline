name: agentic-platform

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16.4-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [data]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./gcp/infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7.2.5-alpine}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [data]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2024-07-16T23-46-41Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [data]
    volumes:
      - minio-data:/data
    restart: unless-stopped

  telemetry:
    image: otel/opentelemetry-collector-contrib:${OTEL_IMAGE_TAG:-0.105.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: otel-config
        target: /etc/otelcol-contrib/config.yaml
    networks: [backend]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: gcp/infrastructure/docker/control-plane.Dockerfile
    environment:
      PLATFORM_ENVIRONMENT: development
      PLATFORM_AUTH_MODE: development
      PLATFORM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PLATFORM_DOCS_ENABLED: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: gcp/infrastructure/docker/control-plane.Dockerfile
    environment:
      PLATFORM_ENVIRONMENT: development
      PLATFORM_AUTH_MODE: development
      PLATFORM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PLATFORM_CORS_ORIGINS: http://localhost:3000
      PLATFORM_LOG_LEVEL: INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
    networks: [backend, data]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: gcp/infrastructure/docker/frontend.Dockerfile
    environment:
      PLATFORM_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]
    restart: unless-stopped

configs:
  otel-config:
    file: ./gcp/infrastructure/otel/collector-config.yaml

networks:
  backend:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
