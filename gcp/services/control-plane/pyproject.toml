[project]
name = "agentic-platform-control-plane"
version = "0.1.0"
description = "FastAPI control plane for Agentic Platform Baseline"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx2>=2.9,<3",
  "jsonschema>=4.24,<5",
  "mypy>=1.16,<2",
  "openapi-spec-validator>=0.7,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.24,<5",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
platform-api = "platform_api.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]
