version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    # Disable unsolicited version-update PRs for repositories created from the
    # template. Vulnerability alerts and security updates remain enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /gcp/infrastructure/docker
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
